version: "3.9"

# Full factory stack. Portable: runs on any Linux box with Docker.
# App processes (workers/api/telegram) can run via `docker compose up` in prod
# or via `pnpm all` locally against these services.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-factory}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-factorysecret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  factory:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./sites:/app/sites
      - ./deploys:/app/deploys
    ports:
      - "127.0.0.1:8787:8787"   # dashboard/API
      - "127.0.0.1:8788:8788"   # demo static server

volumes:
  pgdata:
  miniodata:
